name: Publish GitHub Pages demo portal

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
      - 'public/index.html'
      - 'public/app.js'
      - 'public/hosted.css'
      - 'public/hosted.js'
      - 'public/style.css'
      - 'public/hosted-config.example.json'
      - 'public/extension-guide.html'
      - 'public/downloads/archive-demo-login-extension.zip'
      - 'browser-extension/**'
      - 'scripts/build-extension.js'
      - 'scripts/build-pages.js'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Package credential-free browser extension
        run: |
          node scripts/build-extension.js
          mkdir -p public/downloads
          cd dist
          zip -q -r archive-demo-login-extension-build.zip archive-demo-login-extension
          cd ..
          cp dist/archive-demo-login-extension-build.zip public/downloads/archive-demo-login-extension.zip
      - name: Build credential-free portal
        run: node scripts/build-pages.js
        env:
          DEMO_DESKTOP_URL: ${{ vars.DEMO_DESKTOP_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
