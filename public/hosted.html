<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="档案系统演示入口，支持通过本机浏览器扩展自动填写网页系统登录信息。" />
    <title>档案系统演示导航台</title>
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="./hosted.css" />
    <script src="./hosted.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#systems">跳到系统入口</a>
    <header class="site-header">
      <a class="brand" href="./" aria-label="档案系统演示导航台首页">
        <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 4h16v5H4zM6 9v11h12V9M10 13h4M9 4v5M15 4v5" /></svg></span>
        <span>档案演示<span class="brand-secondary">ARCHIVE DEMO</span></span>
      </a>
      <nav class="header-nav" aria-label="主导航">
        <a class="nav-link" href="#systems">系统入口</a>
        <a class="nav-link" href="./extension-guide.html">自动登录扩展</a>
        <span class="desktop-state" id="desktop-state" role="status" aria-live="polite">正在读取演示入口</span>
      </nav>
    </header>
    <main>
      <section class="hosted-intro" aria-labelledby="page-title">
        <p class="eyebrow"><span></span> SECURE ARCHIVE DEMO</p>
        <h1 id="page-title">档案系统演示导航台</h1>
        <p class="hosted-lede">选择要演示的系统，在新标签页中打开。</p>
        <p class="hosted-explainer">每个浏览器首次保存所需系统密码一次；以后点击系统演示，扩展会自动填写登录信息。</p>
        <div class="hosted-actions">
          <a class="hosted-launch" href="./downloads/archive-demo-login-extension.zip" download>下载自动登录扩展</a>
          <a class="hosted-secondary" href="./extension-guide.html">安装说明</a>
          <a class="hosted-launch" id="desktop-launch" href="#systems" hidden>进入 Windows 演示桌面</a>
        </div>
      </section>
      <section class="hosted-systems main-shell" id="systems" aria-labelledby="systems-title">
        <div class="section-heading">
          <div class="section-title"><h2 id="systems-title">系统入口</h2></div>
          <span class="system-count">8 个系统</span>
        </div>
        <div class="hosted-grid" id="system-grid" aria-busy="true"></div>
        <p class="hosted-note" id="desktop-note" role="status" aria-live="polite"></p>
      </section>
    </main>
    <footer class="hosted-footer">演示系统入口及账号由所属单位授权管理。</footer>
  </body>
</html>
